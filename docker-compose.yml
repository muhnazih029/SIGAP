services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Dev default `changeme` is an intentional non-secret placeholder
      # (scanner-ignored). Prod secrets come from `.env` (gitignored).
      POSTGRES_USER: ${POSTGRES_USER:-sigap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-sigap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # localhost-only: DB never exposed to LAN, migrate via compose exec
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  app:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    # heap cap: STB has <1GB RAM, keep npm install from OOM-killing the box
    command: sh -c "NODE_OPTIONS=--max-old-space-size=256 npm install --no-audit --no-fund && npm start"
    volumes:
      - ./:/app
      - ./public/uploads:/app/public/uploads
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file: .env
    depends_on:
      - db

volumes:
  pgdata:
